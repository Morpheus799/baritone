
name: Tests

on:
  push:
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      run: |
        if [ -z "${JAVA_HOME_25_X64:-}" ]; then
          echo "JAVA_HOME_25_X64 is not available on this runner"
          exit 1
        fi
        echo "JAVA_HOME=${JAVA_HOME_25_X64}" >> "$GITHUB_ENV"
        echo "${JAVA_HOME_25_X64}/bin" >> "$GITHUB_PATH"
        java -version
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Executing tests
      run: ./gradlew test

# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      run: |
        if [ -z "${JAVA_HOME_25_X64:-}" ]; then
          echo "JAVA_HOME_25_X64 is not available on this runner"
          exit 1
        fi
        echo "JAVA_HOME=${JAVA_HOME_25_X64}" >> "$GITHUB_ENV"
        echo "${JAVA_HOME_25_X64}/bin" >> "$GITHUB_PATH"
        java -version

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build -Pmod_version="$(git describe --always --tags --first-parent | cut -c2-)"

    - name: Archive Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Artifacts
        path: dist/
        
    - name: Archive mapping.txt
      uses: actions/upload-artifact@v7
      with:
        name: Mappings
        path: mapping/

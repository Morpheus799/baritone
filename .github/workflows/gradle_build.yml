# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Prefer the JDK 25 that is preinstalled on the runner image to avoid downloading one
    - name: Set up JDK 25
      id: jdk
      run: |
        echo "Available preinstalled JDKs:"
        ls /usr/lib/jvm || true
        ls /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk 2>/dev/null || true
        if [ -n "$JAVA_HOME_25_X64" ]; then
          echo "Using preinstalled JDK 25: $JAVA_HOME_25_X64"
          echo "JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "JDK 25 is not preinstalled on this runner"
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install JDK 25 (fallback)
      if: steps.jdk.outputs.found == 'false'
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'zulu'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build -Pmod_version="$(git describe --always --tags --first-parent | cut -c2-)"

    - name: Archive Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Artifacts
        path: dist/

    - name: Archive mapping.txt
      uses: actions/upload-artifact@v7
      with:
        name: Mappings
        path: mapping/
